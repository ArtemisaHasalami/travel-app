<div class="login-container">
  <div class="login-card">
    <img src="assets/login.jpg" alt="Login Image" class="login" />
    <h2>Login</h2>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="login-btn">Login</button>
    </form>

    <p class="register-link">
      Don't have an account? <a routerLink="/register">Register here</a>
    </p>

    <div class="login-footer">
      <p>© 2026 Travel App</p>
    </div>
  </div>
</div>
