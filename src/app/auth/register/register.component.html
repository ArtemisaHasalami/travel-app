<div class="login-container">
  <div class="login-card">
    <h2>Register</h2>
    <form (ngSubmit)="register()">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="login-btn">Register</button>
    </form>
    <button type="button" class="home-btn" routerLink="/">Go to Home</button>
    <div class="login-footer">
      <p>© 2026 Travel App</p>
    </div>
  </div>
</div>
